<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Impro Vote · Résultats</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page screen-page">
    <section class="header">
      <p class="eyebrow">Écran résultats</p>
      <h1 id="screenTitle">Vote en direct</h1>
      <p id="screenSubtitle">Les résultats se mettent à jour automatiquement.</p>
    </section>

    <section class="card">
      <div class="status-pill"><span id="statusDot" class="dot"></span><span id="statusText">Chargement…</span></div>
      <div class="big-timer" id="timerText">--</div>

      <div class="results">
        <div class="result-row">
          <div class="team-name" id="team1Name">Équipe 1</div>
          <div class="score" id="team1Score">0</div>
          <div class="plus-one" id="plusTeam1">+1</div>
        </div>
        <div class="result-row">
          <div class="team-name" id="team2Name">Équipe 2</div>
          <div class="score" id="team2Score">0</div>
          <div class="plus-one" id="plusTeam2">+1</div>
        </div>
      </div>

      <div class="winner" id="winnerBox" hidden></div>
    </section>
  </main>

  <script type="module" src="./screen.js"></script>
</body>
</html>
