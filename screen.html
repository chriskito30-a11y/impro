<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Écran · Impro Vote Live</title>
  <meta name="theme-color" content="#ff7a3d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ImproVote" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="screen-bg">
  <main id="screenPanel" class="screen-stage">
    <section id="missingRoom" class="screen-message" hidden>
      <h1>Salle introuvable</h1>
      <p>Le lien écran doit contenir une salle.</p>
    </section>

    <section id="screenContent" class="screen-content" hidden>
      <div class="screen-header">
        <img id="screenMainImage" class="screen-main-image" alt="Image principale" hidden />
        <p id="screenSubtitle" class="screen-subtitle">Vote du public</p>
        <h1 id="screenTitle">Match d'improvisation</h1>
      </div>

      <div class="screen-status-row">
        <div id="screenStatus" class="screen-status">En attente du vote</div>
        <div id="screenTimer" class="screen-timer">--</div>
      </div>

      <section class="scoreboard">
        <article id="team1Card" class="score-card">
          <div class="score-card-media">
            <img id="team1ScreenImage" alt="Équipe 1" hidden />
          </div>
          <div class="score-card-body">
            <h2 id="team1ScreenName">Équipe 1</h2>
            <div id="team1Score" class="score-number">0</div>
            <div id="team1Plus" class="plus-one" aria-hidden="true">+1</div>
          </div>
        </article>

        <article id="team2Card" class="score-card">
          <div class="score-card-media">
            <img id="team2ScreenImage" alt="Équipe 2" hidden />
          </div>
          <div class="score-card-body">
            <h2 id="team2ScreenName">Équipe 2</h2>
            <div id="team2Score" class="score-number">0</div>
            <div id="team2Plus" class="plus-one" aria-hidden="true">+1</div>
          </div>
        </article>
      </section>

      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <footer class="screen-footer">
        <span id="totalScreenVotes">0 vote</span>
        <strong id="winnerText"></strong>
      </footer>
    </section>
  </main>

  <script type="module" src="./screen.js"></script>
  <script type="module" src="./pwa.js"></script>
</body>
</html>
