<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vote · Impro Vote Live</title>
  <meta name="theme-color" content="#ff7a3d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ImproVote" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="app-bg vote-body">
  <main class="vote-shell">
    <section id="missingRoom" class="panel-card" hidden>
      <h1>Salle introuvable</h1>
      <p>Le lien de vote doit contenir une salle.</p>
    </section>

    <section id="votePanel" class="vote-card" hidden>
      <img id="voteMainImage" class="vote-main-image" alt="Image du spectacle" hidden />
      <p id="voteSubtitle" class="eyebrow">Vote du public</p>
      <h1 id="voteTitle">Match d'improvisation</h1>
      <div id="voteTimer" class="vote-timer">En attente</div>
      <p id="voteMessage" class="vote-message">Attends que l'arbitre lance le vote.</p>

      <div class="vote-buttons">
        <button id="team1Button" class="team-vote-button" data-choice="team1">
          <img id="team1VoteImage" alt="Équipe 1" hidden />
          <span id="team1VoteName">Équipe 1</span>
        </button>
        <button id="team2Button" class="team-vote-button" data-choice="team2">
          <img id="team2VoteImage" alt="Équipe 2" hidden />
          <span id="team2VoteName">Équipe 2</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="app-credit" aria-label="Crédits de l'application">
    <span>© 2026 — Application créée par Christophe Gros - <a href="https://www.faistonshow.fr" target="_blank" rel="noopener">Fais Ton Show</a></span>
    <span class="credit-separator" aria-hidden="true">•</span>
    <a href="./cgu.html">CGU</a>
  </footer>

  <script type="module" src="./vote.js"></script>
  <script type="module" src="./pwa.js"></script>
</body>
</html>
