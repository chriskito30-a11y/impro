<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Impro Vote · Public</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <section class="header">
      <p class="eyebrow">Vote public</p>
      <h1>Votez !</h1>
      <p id="voteSubtitle">Attente du lancement par l’arbitre.</p>
    </section>

    <section class="card">
      <div class="status-pill"><span id="statusDot" class="dot"></span><span id="statusText">Chargement…</span></div>
      <div class="big-timer" id="timerText">--</div>
      <p class="muted" id="instructionText">Le vote apparaîtra ici dès qu’il sera lancé.</p>

      <div class="vote-buttons">
        <button id="voteTeam1" class="vote-button" disabled>Équipe 1</button>
        <button id="voteTeam2" class="vote-button team2" disabled>Équipe 2</button>
      </div>

      <p class="message" id="voteMessage">Un seul vote par appareil et par impro.</p>
    </section>
  </main>

  <script type="module" src="./vote.js"></script>
</body>
</html>
